name: stt-portal

x-app-env: &app-env
  DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
  LOCAL_STORAGE_DIR: /data/storage
  WORK_DIR: /data/work

services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  web:
    build:
      context: .
      dockerfile: deploy/web.Dockerfile
    image: stt-portal-web
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: deploy/worker.Dockerfile
    image: stt-portal-worker
    restart: unless-stopped
    env_file: .env
    environment: *app-env
    stop_grace_period: 30s
    volumes:
      - appdata:/data
      - hf-cache:/models
    depends_on:
      web:
        condition: service_healthy
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:-:80}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      - web

volumes:
  pgdata:
  appdata:
  hf-cache:
  caddy-data:
  caddy-config:
